[package]
name = "bitchat_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "bitchat_core"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
getrandom = "0.2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
blake2 = "0.10"
chacha20poly1305 = "0.10"

[profile.release]
opt-level = "z"
lto = true
strip = true
